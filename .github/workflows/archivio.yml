name: archivio-flussi
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archivio
  cancel-in-progress: false
jobs:
  fotografia:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: codice
      - name: Prepara il ramo dati
        run: |
          git clone --depth 1 --branch dati "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" archivio 2>/dev/null || {
            mkdir archivio && cd archivio && git init -q -b dati && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"; }
      - name: Fotografia subnet (solo lettura)
        working-directory: archivio
        run: python3 ../codice/raccogli.py
      - name: Salva
        working-directory: archivio
        run: |
          git config user.name "tao-sentinel"
          git config user.email "actions@users.noreply.github.com"
          git add dati
          git commit -qm "fotografia $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin dati && break; sleep 5; git pull -q --rebase origin dati || true; done
